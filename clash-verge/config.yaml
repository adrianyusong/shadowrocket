# Clash 配置 — 由 Clash Verge Rev 擴充腳本移植
# 來源 https://github.com/adrianyusong/shadowrocket/tree/main/clash-verge
#
# 使用前必須替換 <YOUR-SUBSCRIPTION-URL> 為你的機場訂閱網址。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true      # 送兩次探測消除握手差異，跨協議比較才公平
tcp-concurrent: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
find-process-mode: 'off'  # iOS 無進程概念
geox-url:
  geoip: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat'
  geosite: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat'
  mmdb: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb'
  asn: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb'

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP: { ports: [80, '8080-8880'] }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }

dns:
  enable: true
  # 只綁本機：TUN 的 dns-hijack any:53 已經接管所有 DNS，
  # 綁 0.0.0.0 會讓本機對區網變成開放解析器，也容易和其他佔 53 埠的服務衝突
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  # 注意：'*' 只匹配單層，子網域會漏；需要遞迴匹配一律用 '+.'
  fake-ip-filter:
  - '+.lan'
  - '+.local'
  - '+.localdomain'
  - '+.home.arpa'
  - '+.arpa'
  - '+.wpad'
  - time.*.com
  - time.*.gov
  - ntp.*.com
  - '+.pool.ntp.org'
  - '+.market.xiaomi.com'
  - localhost.ptlogin2.qq.com
  - '+.msftncsi.com'
  - '+.msftconnecttest.com'
  # STUN / NAT 穿透與遊戲主機：走 fake-ip 會讓 P2P 與連線品質偵測失敗
  - '+.stun.*.*'
  - '+.stun.*.*.*'
  - '+.stun.playstation.net'
  - '+.n.n.srv.nintendo.net'
  - xbox.*.microsoft.com
  - '+.xboxlive.com'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - tls://223.5.5.5
  direct-nameserver: []
  direct-nameserver-follow-policy: true
  # 取代舊的 fallback + fallback-filter：直接按域名歸屬指定解析器，
  # 不必先查一次再用 geoip 判斷要不要重查，少一個 round-trip
  nameserver-policy:
    '+.cloudflare-dns.com,+.dns.google,+.doh.pub,+.alidns.com':
    - 223.5.5.5
    - 119.29.29.29
    'geosite:cn,private':
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    'geosite:geolocation-!cn':
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  respect-rules: true
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true

proxy-providers:
  airport:
    type: http
    url: '<YOUR-SUBSCRIPTION-URL>'
    interval: 3600
    path: ./providers/airport.yaml
    health-check: { enable: true, interval: 300, url: 'https://www.gstatic.com/generate_204' }

proxy-groups:
  - name: '🚀 節點選擇'
    type: select
    proxies: ['⚡ 全局最快', '🚄 全部 Hy2', '🌐 全部 VLESS', '🇭🇰 香港', '🇹🇼 台灣', '🇯🇵 日本', '🇸🇬 獅城', '🇺🇸 美國', '🇰🇷 韓國', '🇬🇧 英國']
  - name: '⚡ 全局最快'
    type: url-test
    use: [airport]
    filter: '专线|專線|住宅|IPLC|IEPL|Premium'
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 100
    lazy: true
  - name: '🇭🇰 香港'
