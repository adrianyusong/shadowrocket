# 外区 Apple Music / Apple TV+ / Apple News 等需代理的苹果服务
🎵 苹果媒体 = select, 🚀 节点选择, 🇺🇲 美国, 🇯🇵 日本, DIRECT, policy-select-name=🚀 节点选择
🐱 GITHUB = select, 🚀 节点选择, DIRECT
