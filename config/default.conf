# ============ 高频埋点：用 REJECT-DROP 抑制重试风暴 ============
# 日志实测（2026-08-12 19:09 ~ 08-13 20:09，88645 条连接）：
#   rmonitor.qq.com                       19109 次 = 26.5 次/分钟，峰值小时 3515
#   *.jpush.cn（极光推送统计，5 个子域）   24592 次
#   穿山甲 SDK（pangolin / pangle）         3990 次
#   h.trace.qq.com                          753 次
# 合计 47548 条，占全部日志的 54%。
#
# 成因是 REJECT 立即给出明确失败，App 拿到答复就马上重试。
# 三种拒绝策略的区别：
#   REJECT          返回 HTTP 404
#   REJECT-DROP     丢弃 IP 包，客户端收不到任何反馈
#   REJECT-NO-DROP  返回 ICMP 端口不可达
# 这里要的是让 App 退避，所以用 DROP：不回应，App 必须等 TCP 超时，
# 退避算法才会拉长间隔。（与之相反的场景是 QUIC 屏蔽——那里要尽快回落，
# 现已改用 [General] 的 block-quic = all-proxy 由 App 原生处理。）
# 预期请求量降一到两个数量级，拦截效果不变，省电量与唤醒次数。
# 【待验证】这是基于重试机制的推断，实际降幅需下一份日志确认。
#
# 不走 DIRECT 的理由：这些是崩溃/性能/设备信息上报，放行等于如实交出数据，
# 且请求照发，省不下多少电。
#
# 必须排在下方广告规则集之前，才能确保用的是 DROP 而不是普通 REJECT。
# 注意：若同一域名也被模块拦截，模块规则优先，本节不生效。
DOMAIN,rmonitor.qq.com,REJECT-DROP
DOMAIN,h.trace.qq.com,REJECT-DROP
DOMAIN-SUFFIX,jpush.cn,REJECT-DROP
DOMAIN-SUFFIX,jpush.io,REJECT-DROP
DOMAIN-SUFFIX,pangolin-sdk-toutiao1.com,REJECT-DROP
DOMAIN-SUFFIX,pangle.io,REJECT-DROP

