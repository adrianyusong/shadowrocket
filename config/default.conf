# ============ 兜底 ============
FINAL,🐟 漏网之鱼

[Host]
localhost = 127.0.0.1

[MITM]
# 配置自身不含重写脚本，但 iRingo 等模块需要 MITM。
# 这里保持 true，否则每次重新拉取配置都会把 App 里的 MITM 开关按回去，
# 表现为模块间歇性失效。
enable = true

# hostname 留空是对的：模块用 hostname = %APPEND% xxx 追加自己的域名，
# 启用模块后自动并入全局列表，无需在此手抄。
# 在 Settings → MITM 可以看到合并后的完整列表。
hostname =

# ca-passphrase 与 ca-p12 是本机私钥，绝不要写进仓库。
# 证书在 App 内生成：Settings → 证书 → 生成新的 CA 证书 → 安装，
# 再到 iOS 通用 → 关于 → 证书信任设置 里启用。
