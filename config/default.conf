# 自建 CF 节点（edgetunnel 一类）。节点名须含独立的 CF 或 Cloudflare；
# 不会命中机场的 CTCU（那是 CF 中转，由上面直连组的判据排除）。
# 在 App 里另加 CF 的订阅即可，订阅地址含 UUID、等同密码，不写进本配置。
☁️ CF优选 = url-test, policy-regex-filter = (?i)^(?!.*(?:剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|Expire|Traffic|Reset))(?=.*((?<![A-Za-z])CF(?![A-Za-z])|Cloudflare)).*$, url = https://www.gstatic.com/generate_204, interval = 600, tolerance = 200

# 机场自己标注为流媒体优化的节点，解锁成功率通常更高。
🎞️ 流媒体节点 = url-test, policy-regex-filter = (?i)^(?!.*(?:剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|Expire|Traffic|Reset))(?=.*(流媒体|流媒體)).*$, url = https://www.gstatic.com/generate_204, interval = 600, tolerance = 200

# 倍率低于 1x 的节点，同样流量少扣套餐。适合大文件下载一类不挑落地的场景。
# 前面的逆序环视避免把 10.1x 之类误判成低倍率。
💴 低倍率 = url-test, policy-regex-filter = (?i)^(?!.*(?:剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|Expire|Traffic|Reset))(?=.*(?<![0-9.])0\.[0-9]+ ?x).*$, url = https://www.gstatic.com/generate_204, interval = 600, tolerance = 200

