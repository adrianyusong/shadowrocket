DOMAIN-SUFFIX,amap.com,🇨🇳 国内服务

# IP 层兜底：ChinaMax 12445 条 IP-CIDR + GEOIP,CN。
# 域名层没覆盖到的国内服务由这两条接住，代价是要等 DNS 解析完成。
# no-resolve 让本规则只对「直接用 IP 发起的连接」生效，域名请求一律跳过。
# 不加时，任何走到这里的域名都会先经本地（国内）DNS 解析一次以判断归属：
#   1. 域名泄漏给国内 DNS
#   2. 解析被污染时境外域名会被判成国内走直连——LinkedIn 正是此类
# 代价：域名层没覆盖到的国内站点不再由此兜底，会落到 FINAL 走代理。
# 上方 china.list 有 QuantumultX-China 3674 条域名 + ChinaDomains 自维护列表，
# 覆盖够厚；真发现某个国内站点走了代理，补进 rule/ChinaDomains.list 即可。
GEOIP,CN,🇨🇳 国内服务,no-resolve

# ============ 兜底 ============
FINAL,🐟 漏网之鱼

[Host]
localhost = 127.0.0.1

[MITM]
# 配置自身不含重写脚本，但 iRingo 等模块需要 MITM。
# 这里保持 true，否则每次重新拉取配置都会把 App 里的 MITM 开关按回去，
# 表现为模块间歇性失效。
enable = true

# hostname 留空是对的：模块用 hostname = %APPEND% xxx 追加自己的域名，
# 启用模块后自动并入全局列表，无需在此手抄。
# 在 Settings → MITM 可以看到合并后的完整列表。
hostname =

# ca-passphrase 与 ca-p12 是本机私钥，绝不要写进仓库。
# 证书在 App 内生成：Settings → 证书 → 生成新的 CA 证书 → 安装，
# 再到 iOS 通用 → 关于 → 证书信任设置 里启用。