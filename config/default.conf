[URL Rewrite]
# google.cn / g.cn 是 Google 中国的旧域名，2010 年退出后只剩一个跳转落地页。
# 重写成 www.google.com，让旧书签、二维码、App 内链接直接落到真正的 Google。
#
# 下面几条要生效必须满足两个条件，缺一不可：
#   1. MITM enable = true
#   2. 对应域名在下面 [MITM] hostname 列表里
# 之前删掉它们正是因为条件 2 不满足——hostname 为空，规则从不触发，是死代码。
^https?://(www\.)?g\.cn https://www.google.com 302
^https?://(www\.)?google\.cn https://www.google.com 302
# 地图子域单独指到 Google 地图，落到 google.com 首页等于丢掉用户意图。
^https?://(ditu|maps)\.google\.cn https://maps.google.com 302


# --- iRingo MapKit ---
# 把 Apple 地图配置端点指向 mapkit.pages.dev，解锁国际版功能（境外 POI、路况、卫星图）。
# 注意：该端点是第三方服务器，等于让它决定你的地图客户端收到什么配置。
# 模块原文写作 {{{endpoint}}} 占位符，此处代入其默认值。
^https?:\/\/configuration\.ls\.apple\.com\/config\/defaults https://mapkit.pages.dev/config/defaults header
^https?:\/\/gspe35-ssl\.ls\.apple\.com\/config\/announcements https://mapkit.pages.dev/config/announcements header
^https?:\/\/gspe35-ssl\.ls\.apple\.com\/geo_manifest\/dynamic\/config https://mapkit.pages.dev/geo_manifest/dynamic/config header

[Script]
# --- iRingo News ---
# 解锁 Apple News（国区不可用）。版本钉死在 v3.2.1：
# 模块原文用随版本浮动的地址，钉死后升级需手动改，但避免了远端脚本
# 在你不知情时被替换——它运行在解密后的明文流量上。
# 升级前先看 https://github.com/NSRingo/News/releases 的变更说明。
News.v1.configs = type=http-request, pattern=^https?:\/\/news(-todayconfig)?-edge\.apple\.com\/v1\/configs, requires-body=1, script-path=https://github.com/NSRingo/News/releases/download/v3.2.1/request.bundle.js
News.analyticseventsv2.async = type=http-request, pattern=^https?:\/\/news(-sports)?-events\.apple\.com\/analyticseventsv2\/async, requires-body=1, script-path=https://github.com/NSRingo/News/releases/download/v3.2.1/request.bundle.js
News.v1.search = type=http-request, pattern=^https?:\/\/news-client-search\.apple\.com\/v1\/search, requires-body=0, script-path=https://github.com/NSRingo/News/releases/download/v3.2.1/request.bundle.js

[MITM]
# 配置内联了 iRingo MapKit 重写与 News 脚本，两者都依赖 MITM。
# 这里保持 true，否则每次重新拉取配置都会把 App 里的 MITM 开关按回去，
# 表现为模块间歇性失效。
enable = true

# 列出本配置 [URL Rewrite] 与 [Script] 需要解密的域名。
# App 内另装的模块用 hostname = %APPEND% xxx 追加，会并入而非替换本列表。
# 列表越小性能与风险越低——每多一个域名就多一份明文流量被解密。
# 在 Settings → MITM 可以看到合并后的完整列表。
hostname = *.g.cn, *.google.cn, configuration.ls.apple.com, gspe35-ssl.ls.apple.com, news-edge.apple.com, news-todayconfig-edge.apple.com, news-events.apple.com, news-sports-events.apple.com, news-client.apple.com, news-client-search.apple.com

# ca-passphrase 与 ca-p12 是本机私钥，绝不要写进仓库。
# 证书在 App 内生成：Settings → 证书 → 生成新的 CA 证书 → 安装，
# 再到 iOS 通用 → 关于 → 证书信任设置 里启用。