FINAL,🐟 漏网之鱼

[Host]
localhost = 127.0.0.1
# 阻断 UDP 443（QUIC），强制流媒体回落 TCP，规则与解锁判定更稳定
# 若视频加载变慢可注释掉下面两行
# 需要时在 [Rule] 中改用 AND,((PROTOCOL,UDP),(DST-PORT,443)),REJECT

[URL Rewrite]
# 去除跳转与追踪参数
^https?://(www.)?g\.cn https://www.google.com 302
^https?://(www.)?google\.cn https://www.google.com 302

[MITM]
# 默认关闭。仅在需要 URL 重写 / 去广告脚本时开启，
# 并在 App 内生成并信任 CA 证书。
enable = false
hostname =
# ca-passphrase 与 ca-p12 是本机私钥，绝不要写进仓库
