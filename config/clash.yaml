# domain / ipcidr 用 MRS（mihomo 的预编译格式，tools/build-mrs.py 从 stash/ 转换）：
# iOS 的 Network Extension 只有约 50 MiB 可用，大型 text 规则集在设备上解析建表
# 可能把它挤爆。
# classical 没有 MRS 格式，而且每份只有几条到一百多条，直接内嵌（type: inline）：
# 不必为它们各开一个远程规则集，启动与每天更新时少发同样多的请求，也不存在「拉取
# 失败后规则静默消失」。内嵌时剔掉 mihomo 不认的 USER-AGENT（Stash 认，所以共用的
# stash/ 源文件里还留着）。代价：这部分规则只随本文件更新，不再每天自己刷新。
rule-providers:
  direct-domain:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/adrianyusong/shadowrocket/main/mrs/direct-domain.mrs
    path: ./ruleset/direct-domain.mrs
    interval: 86400
    proxy: 🚀 节点选择
  direct-ipcidr:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/adrianyusong/shadowrocket/main/mrs/direct-ipcidr.mrs
    path: ./ruleset/direct-ipcidr.mrs
    interval: 86400
    proxy: 🚀 节点选择
  reject-ads-domain:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/adrianyusong/shadowrocket/main/mrs/reject-ads-domain.mrs
    path: ./ruleset/reject-ads-domain.mrs
    interval: 86400
    proxy: 🚀 节点选择
  reject-ads-ipcidr:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/adrianyusong/shadowrocket/main/mrs/reject-ads-ipcidr.mrs
    path: ./ruleset/reject-ads-ipcidr.mrs
    interval: 86400
    proxy: 🚀 节点选择
