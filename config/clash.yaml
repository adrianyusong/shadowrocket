  # 没有引用的 classical 集（剔掉 USER-AGENT 后一条不剩）：apple-media-classical、disney-classical、hbo-classical、bahamut-classical

# 规则由 tools/build-clash.py 从 config/default.conf 的 [Rule] 逐行翻译，
# 顺序与内联规则与 Shadowrocket 完全一致；注释也一并带过来。
# Clash 独有的只有三处：开头的 QUIC 子规则入口、GEOIP,CN 之前的 GEOSITE,CN，
# 以及不引用上面那几份只含 USER-AGENT 的 classical 集。
rules:
  # ============ QUIC（Clash 独有）============
  # Shadowrocket 用 block-quic = all-proxy 只挡走代理的 UDP/443，Clash for Apple 没有
  # 这个开关，clash.md 的做法是写规则。UDP/443 一律先进子规则 QUIC（文件末尾的
  # sub-rules）：它是下面全部规则的镜像，默认走代理的换成 REJECT，默认直连的照旧。
  # 所以国内直连的 QUIC 不受影响，代理流量回落 TCP。必须是第一条。
  - SUB-RULE,(AND,((NETWORK,UDP),(DST-PORT,443))),QUIC
  # ============ 必须压过上游规则集的一条 ============
  # 这一段刻意排在所有 RULE-SET 之前——放在后面就抢不过它们。
  #
  # FCM 推送端点原先在这里内联了 11 条 mtalk 主机，现已改在 tools/sources.txt
  # 把 GoogleFCM 集映射到 📢 谷歌服务，之前漏掉的 firebaseinstallations 等 3 个
  # 主机与 26 条 IP 段都由 google.list 接住。例外是 android.apis.google.com：
  # ai.list 的 DOMAIN-SUFFIX,apis.google.com 排在 google.list 之前会先接住它，
  # 所以在 ai.list 之前单独内联了一条。
  #
  # statsigapi.net 在 reject-ads 集里是 REJECT（返回 404），客户端拿到明确
  # 答复会毫秒级重试。改 REJECT-DROP 让它等 TCP 超时，与 rmonitor.qq.com 同理。
  - DOMAIN-SUFFIX,statsigapi.net,REJECT-DROP
  # ============ 局域网与本机 ============
  - RULE-SET,direct-domain,DIRECT
  - RULE-SET,direct-ipcidr,DIRECT,no-resolve
  # ============ 高频埋点：用 REJECT-DROP 抑制重试风暴 ============
  # 日志实测（2026-08-12 19:09 ~ 08-13 20:09，88645 条连接）：
  # rmonitor.qq.com                       19109 次 = 26.5 次/分钟，峰值小时 3515
  # *.jpush.cn（极光推送统计，5 个子域）   24592 次
  # 穿山甲 SDK（pangolin / pangle）         3990 次
  # h.trace.qq.com                          753 次
  # 合计 47548 条，占全部日志的 54%。
  #
  # 成因是 REJECT 立即给出明确失败，App 拿到答复就马上重试。
  # 三种拒绝策略的区别：
  # REJECT          返回 HTTP 404
  # REJECT-DROP     丢弃 IP 包，客户端收不到任何反馈
  # REJECT-NO-DROP  返回 ICMP 端口不可达
  # 这里要的是让 App 退避，所以用 DROP：不回应，App 必须等 TCP 超时，
  # 退避算法才会拉长间隔。（与之相反的场景是 QUIC 屏蔽——那里要尽快回落，
  # 现已改用 [General] 的 block-quic = all-proxy 由 App 原生处理。）
  # 预期请求量降一到两个数量级，拦截效果不变，省电量与唤醒次数。
  # 【待验证】这是基于重试机制的推断，实际降幅需下一份日志确认。
  #
  # 不走 DIRECT 的理由：这些是崩溃/性能/设备信息上报，放行等于如实交出数据，
  # 且请求照发，省不下多少电。
  #
  # 必须排在下方广告规则集之前，才能确保用的是 DROP 而不是普通 REJECT。
  # 注意：若同一域名也被模块拦截，模块规则优先，本节不生效。
  - DOMAIN,rmonitor.qq.com,REJECT-DROP
  - DOMAIN,h.trace.qq.com,REJECT-DROP
  - DOMAIN-SUFFIX,jpush.cn,REJECT-DROP
  - DOMAIN-SUFFIX,jpush.io,REJECT-DROP
  - DOMAIN-SUFFIX,pangolin-sdk-toutiao1.com,REJECT-DROP
  - DOMAIN-SUFFIX,pangle.io,REJECT-DROP
  # Apple 广告框架。AdvertisingLite 不含，日志实测它经 GEOIP,CN 走了直连
  # （iadsdk.apple.com 16 次、ca.iadsdk.apple.com 27 次）。
  - DOMAIN-SUFFIX,iadsdk.apple.com,REJECT-DROP
  # ============ 广告与隐私 ============
  # reject-ads.list 已并入 anti-AD 的 10 万条广告/追踪域名。
  # 引入原因：blackmatrix7 的 Advertising 系列按服务分类而非按广告网络，
  # 实测 19 个常见广告域名只覆盖 4 个，完整版 Advertising 也只到 2/15；
  # anti-AD 同组覆盖 13/19，且对九个正常服务 0 误伤。
  # 代价：规则总量从 2.3 万涨到 12.3 万，iOS 端加载表现未在设备上验证。
  # simility.com 是 PayPal 风控引擎，已在 tools/exclude.txt 里豁免，
  # 不会被广告段抢走。
  - RULE-SET,reject-ads-domain,🛑 广告拦截
  - RULE-SET,reject-ads-ipcidr,🛑 广告拦截,no-resolve
  - RULE-SET,reject-ads-classical,🛑 广告拦截
  - RULE-SET,reject-privacy-ipcidr,🍃 应用净化,no-resolve
  - RULE-SET,reject-privacy-classical,🍃 应用净化
  # anti-AD 的 openx / adform / adservice / adsystem 短关键词误伤太多，已在
  # tools/exclude.txt 剔除。关键词原先顺带拦住、却没有精确后缀的几类，在这里用
  # 更窄的写法补回：各国家后缀的 adservice.google.<cc>（anti-AD 只收了 .com /
  # .com.au / .com.hk，其余会被 google.list 的 google.<cc> 后缀接住走 📢 谷歌服务），
  # 以及 OpenX / Adform 的两个投放域名。
  - DOMAIN-KEYWORD,adservice.google.,🛑 广告拦截
  - DOMAIN-SUFFIX,servedbyopenx.com,🛑 广告拦截
  - DOMAIN-SUFFIX,adformdsp.net,🛑 广告拦截
  # ============ AI 服务 ============
  # 必须排在 Global / Microsoft / Google 之前，否则会被宽泛规则集抢先命中
  # 上游三家（blackmatrix7 四件套 + iab0x00）合计仍漏掉这几个境外 AI 服务，
  # 实测均无规则命中会掉到 FINAL。deepseek 是国内服务，刻意不列。
  - DOMAIN-SUFFIX,poe.com,🤖 AI 服务
  - DOMAIN-SUFFIX,huggingface.co,🤖 AI 服务
  - DOMAIN-SUFFIX,hf.co,🤖 AI 服务
  - DOMAIN-SUFFIX,cursor.sh,🤖 AI 服务
  - DOMAIN-SUFFIX,cursor.com,🤖 AI 服务
  - DOMAIN-SUFFIX,midjourney.com,🤖 AI 服务
  # Meta AI 与 muse.ai：ai.meta.com / llama.meta.com 原本落到 📘 META，
  # meta.ai 落到节点选择，muse.ai 无命中。归入 AI 组用其为风控设计的稳定出口。
  # 本段排在 ai.list 与 meta.list 之前，故能盖过它们。
  - DOMAIN-SUFFIX,meta.ai,🤖 AI 服务
  - DOMAIN-SUFFIX,ai.meta.com,🤖 AI 服务
  - DOMAIN-SUFFIX,llama.meta.com,🤖 AI 服务
  - DOMAIN-SUFFIX,muse.ai,🤖 AI 服务
  # Claude：ai.list 只收了 claude.ai 与 anthropic.com，这几个没有规则会落到兜底。
  - DOMAIN-SUFFIX,claude.com,🤖 AI 服务
  - DOMAIN-SUFFIX,claudeusercontent.com,🤖 AI 服务
  - DOMAIN-SUFFIX,claudemcpclient.com,🤖 AI 服务
  - DOMAIN-SUFFIX,claudemcpcontent.com,🤖 AI 服务
  - DOMAIN-SUFFIX,clau.de,🤖 AI 服务
  # FCM 的 Android 端点。ai.list 有 DOMAIN-SUFFIX,apis.google.com（Gemini 登录要
  # 与 AI 出口一致，不能剔除），会抢在 google.list 之前把它收进 AI 组。
  - DOMAIN,android.apis.google.com,📢 谷歌服务
  - RULE-SET,ai-domain,🤖 AI 服务
  - RULE-SET,ai-ipcidr,🤖 AI 服务,no-resolve
  - RULE-SET,ai-classical,🤖 AI 服务
  # ============ 流媒体 ============
  - RULE-SET,youtube-domain,📹 YOUTUBE
  - RULE-SET,youtube-ipcidr,📹 YOUTUBE,no-resolve
  - RULE-SET,youtube-classical,📹 YOUTUBE
