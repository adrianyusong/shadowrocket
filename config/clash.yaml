# Clash for Apple / Clash Verge 完整配置
# 由 tools/build-clash.py 生成，请勿手改——下次同步会覆盖。
# https://github.com/adrianyusong/shadowrocket
# 字段按 clash.md（Clash Core v1.19.33-clash.5，基于 mihomo 1.19.33）的说明取舍。
#
# ============================================================
# 这是模板，不是可直接订阅的地址。
#
# 下面 proxy-providers 的 url 是占位符，直接订阅本文件会得到
# 「DNS lookup failed / Provider airport」——占位域名本就解析不了。
#
# Clash for Apple：
#   1. 下载本文件，在配置库的「添加配置」里选「导入文件」
#   2. 点这份配置的 ⓘ，拉到最下面「编辑源码」，把 proxy-providers.airport.url
#      换成你的订阅地址（保留引号）；两家机场都用时，再取消 airport-b 的注释
#      配置大到不能编辑时那里会变成「查看源码」，就先在电脑上改好再导入
# Clash Verge 直接改本地文件即可。
#
# 订阅地址等同凭据：本地改过的文件存成 *.local.yaml（已在 .gitignore 排除），别提交。
# ============================================================
#
# 这份配置只管节点、分组、DNS 与规则。URL 重写去广告、iRingo 这类要解密 HTTPS
# 的功能，在 Clash for Apple 里用「模块」：配置库 ›「模块」粘贴
# module/adblock-rewrite.sgmodule 或 iRingo 的 .sgmodule 链接，再按提示安装并
# 信任「Clash 模块证书」。Apple TV 不支持模块。

mode: rule
# 日常用 warning（clash.md「配置最佳实践」）：info 级每条连接记一行。排查时把这里
# 临时改回 info，或直接用外部控制器的 /logs?level=info 订阅——mihomo 的日志事件是
# 先发布、再按这里的级别决定要不要落盘，订阅端按请求里的 level 过滤，不受这里影响。
log-level: warning
# 写 true 是为了让隧道接管 IPv6，不是为了让 App 用上 IPv6。clash.md「TUN 与网络接入」：
# ipv6 为 false 时隧道不接管 IPv6——在有 IPv6 的网络（多数蜂窝网络）上，直接用 IPv6
# 地址发起的连接整个绕过 Clash：不匹配规则、不走代理、不拦截。受影响的是自带解析
# （HTTPDNS / DoH）或内置 IPv6 地址的 App，例如 Telegram。
# App 照样拿不到 IPv6 地址：下面 dns.ipv6 保持 false，不回 AAAA。
# 副作用：Clash 自己直连时可能用 IPv6（与不开代理时系统的行为一致）；连节点仍优先
# IPv4，见 proxy-providers 的 override.ip-version。
ipv6: true
# 统一延迟基准：扣掉握手耗时再比较，否则 Hy2 会因为握手快而虚高。
# Clash for Apple 不写也默认开启；写明是给默认关闭的其他 mihomo 客户端。
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30

# 外部控制器不写在这里：这是公开模板，照抄的人不改就等于把控制 API 开到局域网。
# 要从电脑看连接与日志，用 App 自带的：更多 › 客户端设置 › 外部控制器 →「局域网」
# （全程 HTTPS，密钥与证书由 App 生成），再用 tools/tail-clash.py 连，
# 页面上显示的证书指纹填进 --fingerprint。

# 以下地理库设置只对 Clash Verge 等桌面 mihomo 客户端生效。Clash for Apple 的
# 地理库由 App 统一准备（iOS / tvOS 用预编译资源），这几项在那里不起作用。
# 规则里用到地理库的有三处：GEOIP,CN、GEOSITE,CN，以及 classical 集里的 IP-ASN
# （ai / telegram / meta / china 共 9 条）。ASN 库在 Clash for Apple 上不会由隧道
# 自动下载——到 App 的「资源」页确认它已备好，否则那几条 IP-ASN 不生效。
#
# GeoIP 数据库默认从 GitHub raw 拉，17 MB 直连几乎必定超时，
# 表现是 [GEO] can.t download GeoIP database file: context deadline exceeded，
# 而且不影响启动——规则静默按旧库匹配。改用 jsDelivr 镜像。
# 注意 ASN 的文件名是 GeoLite2-ASN.mmdb，写成 asn.mmdb 会 404。
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

profile:
  # 记住手动选择的节点，配置更新后不被重置。
  store-selected: true
  store-fake-ip: true

# 域名嗅探：只补「没有域名」的连接。走 fake-ip 的连接自带 DNS 查询时的域名，
# 嗅探不会碰它们；用得上的是自带 DoH 的浏览器、用 HTTPDNS 的国内 App、
# 写死 IP 的连接——没有它，这些连接只能落到 GEOIP 判定。
sniffer:
  enable: true
  # mihomo 默认就是 true，写明是与 clash.md 的示例对齐。
  parse-pure-ip: true
  # 嗅探到的域名只用于规则匹配，不改写连接目标。域名规则读的是嗅探结果
  # （Metadata.RuleHost），与这个开关无关；改写目标反而会丢掉 App 自己
  # 选好的 IP（HTTPDNS），Host 头与 IP 对不上时还会连错地方。
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  # 不给 App 返回 IPv6 地址（AAAA）。顶层 ipv6 为 true 只是让隧道接管 IPv6，见上。
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  # 保留域与局域网
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.home.arpa"
    - "+.invalid"
    - "+.localhost"
    - "+.test"
    - "+.example"
  # 路由器 / 智能家居管理页，域名指向局域网网关地址
    - "+.router.asus.com"
    - "+.linksys.com"
    - "+.linksyssmartwifi.com"
    - "heartbeat.belkin.com"
  # 系统联网检测：拿到假 IP 会被判成「网络受限」，反复弹强制门户
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.ipv6.microsoft.com"
    - "captive.apple.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
  # NTP 校时走 UDP 123。假 IP 对不上时间，会连锁导致 TLS 证书校验失败。
  # 只列具体的直连校时主机。之前用 time.*.com / ntp*.*.com 这类泛通配，
  # 会命中走代理的域名（例如 time.apple.com 曾随 Apple 走代理），违反上面的
  # 收录原则，而 check-config 的 check_fakeip 跳过带内部通配的条目，从没查到。
    - "time.apple.com"
    - "time-ios.apple.com"
    - "time-macos.apple.com"
    - "time.asia.apple.com"
    - "time.euro.apple.com"
    - "time.windows.com"
    - "ntp.aliyun.com"
    - "ntp1.aliyun.com"
    - "ntp2.aliyun.com"
    - "ntp3.aliyun.com"
    - "ntp4.aliyun.com"
    - "ntp5.aliyun.com"
    - "ntp6.aliyun.com"
    - "ntp7.aliyun.com"
    - "ntp.tencent.com"
    - "ntp1.tencent.com"
    - "ntp2.tencent.com"
    - "ntp3.tencent.com"
    - "ntp4.tencent.com"
    - "ntp5.tencent.com"
    - "time1.cloud.tencent.com"
    - "time2.cloud.tencent.com"
    - "time3.cloud.tencent.com"
    - "time4.cloud.tencent.com"
    - "time5.cloud.tencent.com"
    - "+.time.edu.cn"
    - "+.ntp.org.cn"
    - "+.pool.ntp.org"
  # STUN 泛通配（stun.* 等）已去掉：stun.l.google.com 这类走代理，与收录原则
  # 冲突；而 P2P 打洞在 Shadowrocket 侧本就被 stun-response-ip 伪造响应挡掉了。
  # 国内音乐：版权区域按出口 IP 判定，假 IP 会被判成海外 -> 大量歌曲变灰
    - "+.music.163.com"
    - "+.126.net"
    - "+.y.qq.com"
    - "aqqmusic.tc.qq.com"
    - "amobile.music.tc.qq.com"
    - "streamoc.music.tc.qq.com"
    - "mobileoc.music.tc.qq.com"
    - "isure.stream.qqmusic.qq.com"
    - "dl.stream.qqmusic.qq.com"
    - "songsearch.kugou.com"
    - "trackercdn.kugou.com"
    - "+.kuwo.cn"
    - "+.music.migu.cn"
    - "music.taihe.com"
    - "musicapi.taihe.com"
  # B 站 PCDN 要真实 IP 做点对点回源
    - "+.mcdn.bilivideo.cn"
  default-nameserver: [223.5.5.5, 119.29.29.29]
  # fake-ip 加全部 IP 规则带 no-resolve 之下，只有走直连的域名才会真的在本地解析，
  # 所以只放国内 DoH。以前还并行查 AdGuard：从大陆它几乎抢不赢，偶尔抢赢时返回的是
  # 境外视角的 CDN 地址或被它答空，行为不确定；广告拦截交给规则集。
  # 原先的 nameserver-policy（geosite:cn）与这组解析器完全相同，一并去掉。
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 解析节点域名。两家并行，免得一家出问题时所有节点都解析不了。
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxy-providers:
  # 机场订阅共用的三项（取消 airport-b 的注释时同样带上）：
  #   proxy: DIRECT         订阅更新不经节点。不写时请求按规则走，落到 🐟 漏网之鱼 → 🚀，
  #                         等于用这家机场的节点去更新这家机场的订阅：节点全挂（换 IP、
  #                         到期续费后）就再也更新不了。clash.md 也提醒别依赖集合自身。
  #                         订阅域名在当前网络直连不通时，改成另一家订阅的节点或组名。
  #   exclude-filter        信息类伪节点在这里就丢掉，不进任何分组。各组的 filter 仍带
  #                         同一批排除词作第二道保险（新加的订阅忘了写这一项时靠它）。
  #   override.ip-version   连节点优先 IPv4。顶层 ipv6 为 true 之后，节点域名有 AAAA 时
  #                         内核会两个地址族一起试；多数机场的 IPv6 入口不完整，照旧走 IPv4。
  airport:
    type: http
    # ↓↓↓ 换成你的订阅地址（必须是 Clash / mihomo 格式）↓↓↓
    url: "https://请替换.example/subscribe?flag=clash"
    path: ./providers/airport.yaml
    interval: 3600
    proxy: DIRECT
    exclude-filter: "(?i)(剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|订阅|訂閱|续费|續費|客户端|客戶端|🇦🇶|Expire|Traffic|Reset|网站|網站|客服|邀请|邀請|群组|群組|Website)"
    override:
      ip-version: ipv4-prefer
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
  # 第二家机场（例如落云）。分组都是 include-all，加进来就会按节点名自动归组；
  # 🇰🇷 韩国直连 / 🔒 ANYTLS 等只有它有节点，只装一家时这些组是空的（空组等同直连）。
  # airport-b:
  #   type: http
  #   url: "https://第二家机场的订阅地址?flag=clash"
  #   path: ./providers/airport-b.yaml
  #   interval: 3600
  #   proxy: DIRECT
  #   exclude-filter: "(?i)(剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|订阅|訂閱|续费|續費|客户端|客戶端|🇦🇶|Expire|Traffic|Reset|网站|網站|客服|邀请|邀請|群组|群組|Website)"
  #   override:
  #     ip-version: ipv4-prefer
  #     # 给这家的节点名加前缀，两家有同名节点时才分得清（clash.md「配置最佳实践」的写法）。
  #     # 前缀不含地区缩写，不影响各组按名字归类。
  #     additional-prefix: "[B] "
  #   health-check:
  #     enable: true
  #     url: https://www.gstatic.com/generate_204
  #     interval: 300
  # 自建 CF 节点（edgetunnel 一类）作另一个来源时取消下面的注释。
  # 节点名须含独立的 CF 或 Cloudflare 才会进 ☁️ CF优选。
  # 该订阅地址含 UUID，等同密码：只写进 *.local.yaml，别提交。
  # 不写 proxy: DIRECT：workers.dev / pages.dev 一类部署域名在大陆常被污染，
  # 它的订阅照旧按规则经机场节点更新，不存在依赖自身的问题。
  # cf:
  #   type: http
  #   url: "https://你的部署域名/你的订阅路径"
  #   path: ./providers/cf.yaml
  #   interval: 3600

proxy-groups:
  # 自动测速类与手动选择。filter 排除信息类伪节点与自建 CF 节点。
  # exclude-type 排掉订阅里用 type: direct / dns / reject / rematch 声明的内置出站——
  # 它们不是节点；直连伪节点延迟最低，混进 url-test 组会被选中，整组流量悄悄直连。
  # 下面每个 include-all 的组都带这一项。测速参数与 Shadowrocket / Stash 是同一组数值。
  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*(剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|订阅|訂閱|续费|續費|客户端|客戶端|🇦🇶|Expire|Traffic|Reset|网站|網站|客服|邀请|邀請|群组|群組|Website|官方|直连|直連|D(IR)?ECT|(?<![A-Za-z])CF(?![A-Za-z])|Cloudflare)).*$"
    exclude-type: "Direct|Reject|RejectDrop|Compatible|Pass|PassRule|Rematch|Dns"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
  - name: "🔯 故障转移"
    type: fallback
    include-all: true
    filter: "(?i)^(?!.*(剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|订阅|訂閱|续费|續費|客户端|客戶端|🇦🇶|Expire|Traffic|Reset|网站|網站|客服|邀请|邀請|群组|群組|Website|官方|直连|直連|D(IR)?ECT|(?<![A-Za-z])CF(?![A-Za-z])|Cloudflare)).*$"
    exclude-type: "Direct|Reject|RejectDrop|Compatible|Pass|PassRule|Rematch|Dns"
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: "🔮 负载均衡"
    type: load-balance
    include-all: true
    filter: "(?i)^(?!.*(剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|订阅|訂閱|续费|續費|客户端|客戶端|🇦🇶|Expire|Traffic|Reset|网站|網站|客服|邀请|邀請|群组|群組|Website|官方|直连|直連|D(IR)?ECT|(?<![A-Za-z])CF(?![A-Za-z])|Cloudflare)).*$"
    exclude-type: "Direct|Reject|RejectDrop|Compatible|Pass|PassRule|Rematch|Dns"
    url: https://www.gstatic.com/generate_204
    interval: 300
    strategy: consistent-hashing
  - name: "🔧 手动选择"
    type: select
    include-all: true
    filter: "(?i)^(?!.*(剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|订阅|訂閱|续费|續費|客户端|客戶端|🇦🇶|Expire|Traffic|Reset|网站|網站|客服|邀请|邀請|群组|群組|Website|官方|直连|直連|D(IR)?ECT|(?<![A-Za-z])CF(?![A-Za-z])|Cloudflare)).*$"
    exclude-type: "Direct|Reject|RejectDrop|Compatible|Pass|PassRule|Rematch|Dns"
  # 地区直连线路（地区 × 无中转）、自建 CF。与 Stash 同一份定义
  # （build-stash.py 的 DIRECTS / CF_GROUP），都过 guard() 排除伪节点。
  # 英文缩写用逆序环视包裹，否则裸 US 在忽略大小写下会吃掉 Russia / Australia。
  - name: "🇺🇲 美国直连"
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*(?:剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|订阅|訂閱|续费|續費|客户端|客戶端|🇦🇶|Expire|Traffic|Reset|网站|網站|客服|邀请|邀請|群组|群組|Website))(?=.*(美国|美國|美西|美东|美東|洛杉矶|圣何塞|西雅图|达拉斯|凤凰城|United ?States|(?<![A-Za-z])(US|USA|LAX|SJC)(?![A-Za-z])))(?!.*(?<![A-Za-z])CTCU(?![A-Za-z]))(?!.*(中转|中轉|隧道|转发|轉發)).*$"
    exclude-type: "Direct|Reject|RejectDrop|Compatible|Pass|PassRule|Rematch|Dns"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 200
  - name: "🇯🇵 日本直连"
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*(?:剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|订阅|訂閱|续费|續費|客户端|客戶端|🇦🇶|Expire|Traffic|Reset|网站|網站|客服|邀请|邀請|群组|群組|Website))(?=.*(日本|東京|东京|大阪|名古屋|埼玉|Japan|(?<![A-Za-z])(JP|JPN|NRT|KIX)(?![A-Za-z])))(?!.*(?<![A-Za-z])CTCU(?![A-Za-z]))(?!.*(中转|中轉|隧道|转发|轉發)).*$"
    exclude-type: "Direct|Reject|RejectDrop|Compatible|Pass|PassRule|Rematch|Dns"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 200
  - name: "🇸🇬 狮城直连"
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*(?:剩余|剩餘|流量|到期|过期|過期|重置|套餐|官网|官網|订阅|訂閱|续费|續費|客户端|客戶端|🇦🇶|Expire|Traffic|Reset|网站|網站|客服|邀请|邀請|群组|群組|Website))(?=.*(新加坡|狮城|獅城|Singapore|(?<![A-Za-z])(SG|SIN)(?![A-Za-z])))(?!.*(?<![A-Za-z])CTCU(?![A-Za-z]))(?!.*(中转|中轉|隧道|转发|轉發)).*$"
    exclude-type: "Direct|Reject|RejectDrop|Compatible|Pass|PassRule|Rematch|Dns"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 200
  - name: "🇭🇰 香港直连"
