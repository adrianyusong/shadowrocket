  # 否则商店规则会把几十 GB 的游戏下载吃进代理
  - RULE-SET,direct-global-domain,🎯 全球直连
  - RULE-SET,direct-global-classical,🎯 全球直连
  # Apple 地图的中国区服务器：走代理会导致地图数据错乱或不加载，而 apple.list
  # 的 apple.com 全域后缀会把它们送去代理，所以在它之前内联直连。
  # 这几条原是 iRingo MapKit 模块自带的规则。Shadowrocket 版没有装该模块、只把
  # 它的重写内联进了 [URL Rewrite]，规则也就要一并内联；Stash / Clash 两份没有
  # MapKit 重写，这几条照样适用。
  - DOMAIN,gspe11-2-cn-ssl.ls.apple.com,🎯 全球直连
  - DOMAIN,gspe12-cn-ssl.ls.apple.com,🎯 全球直连
  - DOMAIN,gspe19-cn-ssl.ls.apple.com,🎯 全球直连
  - DOMAIN,gspe19-2-cn-ssl.ls.apple.com,🎯 全球直连
  - DOMAIN,gspe79-cn-ssl.ls.apple.com,🎯 全球直连
  - DOMAIN-SUFFIX,is.autonavi.com,🎯 全球直连
  # 定位国家代码接口，iRingo LocationService 的 MITM 目标，模块原文要求直连。
  # 它也在 apple.com 之下，不在这里拦下会随 🍎 苹果服务 走代理。
  # 另一个目标 dispatcher.is.autonavi.com 已被上一条 is.autonavi.com 覆盖。
  - DOMAIN,gspe1-ssl.ls.apple.com,🎯 全球直连
  # DigiCert 是通用 CA，不只 Apple 在用。上游 AppleProxy 收录了 digicert.com，
  # proxy 集又收录了 digicert-validation.com——大量网站的 OCSP / CRL 校验会
  # 跟着走代理，给每次 TLS 握手多加一跳。改直连。
  # 注意：seal / smetrics / app.updates 等追踪子域在 reject-ads 规则集里，
  # 那个规则集排在更前面，仍会被拦截，不受这两条影响。
  - DOMAIN-SUFFIX,digicert.com,🎯 全球直连
