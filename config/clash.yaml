# Clash for Apple / Clash Verge 完整配置
# 由 tools/build-clash.py 生成，请勿手改——下次同步会覆盖。
# https://github.com/adrianyusong/shadowrocket
#
# ============================================================
# 这是模板，不是可直接订阅的地址。
#
# 下面 proxy-providers 的 url 是占位符，直接订阅本文件会得到
# 「DNS lookup failed / Provider airport」——占位域名本就解析不了。
#
# Clash for Apple 的 Profile 导入后不能在 App 内编辑（详情页只有
# update / rename / export / remove），所以必须先改好再导入：
#   1. 在电脑上下载本文件，改两处：
#      a) proxy-providers.airport.url  -> 你的订阅地址
#      b) secret                       -> 你自己生成的随机串
#         生成：python -c "import secrets;print(secrets.token_urlsafe(32))"
#   2. 存成 *.local.yaml，放进 iCloud Drive 或用 AirDrop 传到手机
#   3. Clash → Add Profile → 选「配置文件」导入
# Clash Verge 直接改本地文件即可。
#
# 订阅地址等同凭据，*.local.yaml 已在 .gitignore 排除，别提交。
# ============================================================
#
# 与 Shadowrocket 配置的差异：mihomo 没有 MITM，所以这份配置里
# 没有 iRingo MapKit/News、没有 URL 重写去广告、没有 g.cn 跳转。
# 域名级广告拦截（10 万条 reject 规则）照常生效，URL 级重写去广告没有。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
# 统一延迟基准：扣掉握手耗时再比较，否则 Hy2 会因为握手快而虚高。
# clash.md 的配置参考里明确列为 Supported（Stash 文档无此项，故未启用）。
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
# iOS/tvOS 的 NetworkExtension 拿不到进程信息，开了也只是空转。
find-process-mode: "off"
global-client-fingerprint: chrome

# ============================================================
# 外部控制器：让电脑实时读取连接与日志（配合 tools/tail-clash.py）
#
# clash.md 的字段表把 external-controller / secret / bind-address
# 标为 Advanced —— 支持，但官方 best-practice 明确不建议暴露到局域网。
# 这里是明知代价而为之，以下三条必须看懂再用：
#
# 1) secret 为空 = 整个 API 无鉴权。mihomo 的鉴权中间件写作
#    if secret != "" { r.Use(authentication(secret)) } —— 空值直接不挂载。
#    下面的占位符必须换掉，换成占位符本身也等于用了一个公开的密码。
#
# 2) PUT /configs 一个请求就能替换整份配置（代理、规则、DNS）。
#    也就是说拿到 API 的人可以把你手机的全部流量导向他自己的服务器，
#    不需要任何代码执行。这是最坏情况，比读日志严重得多。
#
# 3) mihomo 没有针对控制器的来源 IP 白名单 —— lan-allowed-ips 管的是
#    代理入站，不是控制 API。绑到局域网时唯一的保护就是这个 secret。
#    绝不要在咖啡厅 / 酒店 / 公司 / 合租的网络上开。
#
# 只想本机用（Clash Verge 桌面版）就把地址改回 127.0.0.1:9090。
# ============================================================
external-controller: 0.0.0.0:9090
secret: "CHANGE-ME-generate-a-random-secret"
external-controller-cors:
  # 默认不给任何网页来源。tools/tail-clash.py 是 Python 客户端，
  # 不受 CORS 限制，所以留空即可。
  allow-origins: []
  # mihomo 的默认值是 true —— 那会让你访问的任何网站都能用 JS
  # 在后台驱动这个控制器。这才是现实中的攻击路径。
  # 要用浏览器面板（metacubexd 等）指向手机 IP 才需要改成 true，
  # 同时把上面的 allow-origins 填成面板的具体地址，不要用 *。
  allow-private-network: false

# GeoIP 数据库默认从 GitHub raw 拉，17 MB 直连几乎必定超时，
# 表现是 [GEO] can.t download GeoIP database file: context deadline exceeded，
# 而且不影响启动——规则静默按旧库匹配。改用 jsDelivr 镜像。
# 注意 ASN 的文件名是 GeoLite2-ASN.mmdb，写成 asn.mmdb 会 404。
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

profile:
  # 记住手动选择的节点，配置更新后不被重置。
  store-selected: true
  store-fake-ip: true

# 域名嗅探：fake-ip 之外的兜底。走 IP 直连的连接靠它还原域名，
# 否则那些连接只能落到 GEOIP 判定，分流精度掉一大截。
sniffer:
  enable: true
  # 用嗅探到的域名覆盖目的地址，规则才能按域名匹配。
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  # 保留域与局域网
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.home.arpa"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.example"
  # 路由器 / 智能家居管理页，域名指向局域网网关地址
    - "*.router.asus.com"
    - "*.linksys.com"
    - "*.linksyssmartwifi.com"
    - "heartbeat.belkin.com"
  # 系统联网检测：拿到假 IP 会被判成「网络受限」，反复弹强制门户
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.ipv6.microsoft.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
  # NTP 校时走 UDP 123。假 IP 对不上时间，会连锁导致 TLS 证书校验失败
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time1.*.com"
    - "time2.*.com"
    - "time3.*.com"
    - "time4.*.com"
    - "time5.*.com"
    - "time6.*.com"
    - "time7.*.com"
    - "ntp.*.com"
    - "ntp1.*.com"
    - "ntp2.*.com"
    - "ntp3.*.com"
    - "ntp4.*.com"
    - "ntp5.*.com"
    - "ntp6.*.com"
    - "ntp7.*.com"
    - "*.time.edu.cn"
    - "*.ntp.org.cn"
    - "+.pool.ntp.org"
    - "time1.cloud.tencent.com"
  # STUN：P2P 打洞靠真实公网 IP 回包，假 IP 会让 NAT 类型探测永远失败
    - "stun.*"
    - "stun.*.*"
    - "stun.*.*.*"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
  # 国内音乐：版权区域按出口 IP 判定，假 IP 会被判成海外 -> 大量歌曲变灰
    - "music.163.com"
    - "*.music.163.com"
    - "*.126.net"
    - "y.qq.com"
    - "*.y.qq.com"
    - "aqqmusic.tc.qq.com"
    - "amobile.music.tc.qq.com"
    - "streamoc.music.tc.qq.com"
    - "mobileoc.music.tc.qq.com"
    - "isure.stream.qqmusic.qq.com"
    - "dl.stream.qqmusic.qq.com"
    - "songsearch.kugou.com"
    - "trackercdn.kugou.com"
    - "*.kuwo.cn"
    - "music.migu.cn"
    - "*.music.migu.cn"
    - "music.taihe.com"
    - "musicapi.taihe.com"
  # B 站 PCDN 要真实 IP 做点对点回源
    - "*.mcdn.bilivideo.cn"
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

proxy-providers:
  airport:
    type: http
    # ↓↓↓ 换成你的订阅地址（必须是 Clash / mihomo 格式）↓↓↓
    url: "https://请替换.example/subscribe?flag=clash"
    path: ./providers/airport.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  # 总入口。手动选择排最前，其余按维度铺开。
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🔧 手动选择"
      - "🇭🇰 香港"
      - "🇹🇼 台湾"
      - "🇯🇵 日本"
      - "🇸🇬 狮城"
      - "🇺🇲 美国"
      - "🇰🇷 韩国"
      - "🇬🇧 英国"
      - "🏠 住宅IP"
      - "🛣️ 专线"
      - "🎞️ 流媒体节点"
      - "💴 低倍率"
      - "🔐 VLESS 节点"
      - "⚡ HY2 节点"
      - "🧩 VMESS 节点"
      - "🐴 TROJAN 节点"
      - "DIRECT"
  - name: "🔧 手动选择"
    type: select
    include-all: true
  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    filter: "(?i)^(?!.*(官网|官方|网站|網站|客服|邀请|邀請|重置|剩余|剩餘|到期|过期|過期|流量|套餐|订阅|訂閱|群组|群組|直连|直連|Expire|Traffic|Reset|Website)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  # 地区分组：按节点名正则筛。英文缩写用逆序环视包裹，
  # 否则裸 US 在忽略大小写下会吃掉 Russia / Australia / Brussels。
  - name: "🇭🇰 香港"
    type: url-test
    include-all: true
    filter: "(?i)(香港|港岛|深港|沪港|Hong ?Kong|(?<![A-Za-z])(HK|HKG)(?![A-Za-z]))"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "🇹🇼 台湾"
    type: url-test
    include-all: true
    filter: "(?i)(台湾|台灣|台北|臺灣|Taiwan|(?<![A-Za-z])(TW|TPE)(?![A-Za-z]))"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "🇯🇵 日本"
    type: url-test
    include-all: true
    filter: "(?i)(日本|東京|东京|大阪|名古屋|埼玉|Japan|(?<![A-Za-z])(JP|JPN|NRT|KIX)(?![A-Za-z]))"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "🇸🇬 狮城"
    type: url-test
    include-all: true
    filter: "(?i)(新加坡|狮城|獅城|Singapore|(?<![A-Za-z])(SG|SIN)(?![A-Za-z]))"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "🇺🇲 美国"
    type: url-test
    include-all: true
    filter: "(?i)(美国|美國|美西|美东|美東|洛杉矶|圣何塞|西雅图|达拉斯|凤凰城|United ?States|(?<![A-Za-z])(US|USA|LAX|SJC)(?![A-Za-z]))"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "🇰🇷 韩国"
    type: url-test
    include-all: true
    filter: "(?i)(韩国|韓國|首尔|首爾|Korea|(?<![A-Za-z])(KR|ICN)(?![A-Za-z]))"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "🇬🇧 英国"
    type: url-test
    include-all: true
    filter: "(?i)(英国|英國|伦敦|倫敦|London|(?<![A-Za-z])(UK|GB|LHR)(?![A-Za-z]))"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  # 线路属性分组，与地区维度正交。
