rules:
  # 高频埋点用 REJECT-DROP：静默丢包让 App 等超时才重试。
  - DOMAIN,rmonitor.qq.com,REJECT-DROP
  - DOMAIN,h.trace.qq.com,REJECT-DROP
  - DOMAIN-SUFFIX,jpush.cn,REJECT-DROP
  - DOMAIN-SUFFIX,jpush.io,REJECT-DROP
  - DOMAIN-SUFFIX,pangolin-sdk-toutiao1.com,REJECT-DROP
  - DOMAIN-SUFFIX,pangle.io,REJECT-DROP
  - DOMAIN-SUFFIX,iadsdk.apple.com,REJECT-DROP
  # LinkedIn 中国已停运，国内 DNS 仍把它解析到国内 IP，
  # 不显式指定会被后面的 GEOIP,CN 判成国内而直连。
  - DOMAIN-SUFFIX,linkedin.com,🚀 节点选择
  - DOMAIN-SUFFIX,licdn.com,🚀 节点选择
  - DOMAIN-SUFFIX,linkedin-ei.com,🚀 节点选择
  - DOMAIN-SUFFIX,linkedin.cn,🚀 节点选择
  - DOMAIN-SUFFIX,licdn.cn,🚀 节点选择
  - DOMAIN-SUFFIX,poe.com,🤖 AI 服务
  - DOMAIN-SUFFIX,huggingface.co,🤖 AI 服务
  - DOMAIN-SUFFIX,hf.co,🤖 AI 服务
  - DOMAIN-SUFFIX,cursor.sh,🤖 AI 服务
  - DOMAIN-SUFFIX,cursor.com,🤖 AI 服务
  - DOMAIN-SUFFIX,midjourney.com,🤖 AI 服务
  # DigiCert 是通用 CA，走代理会给每次 TLS 握手多加一跳。
  - DOMAIN-SUFFIX,digicert.com,🎯 全球直连
  - DOMAIN-SUFFIX,digicert-validation.com,🎯 全球直连
  # FCM 推送端点走代理。上游 GoogleFCM 集把它们归为 DIRECT，那是境外环境的
  # 惯例（长连接过代理更不稳）；但在国内 mtalk.google.com 是通不了的，
  # 直连等于完全收不到推送。clash-verge/README.md 记录了设备上的实测结果。
  # 注意 sources.txt 里「FCM 走代理收不到推送」那条注释与此相反，已一并更正。
  # statsigapi.net 用 REJECT-DROP：主动拒绝会让客户端毫秒级重试，
  # 静默丢包让它等超时，与 rmonitor.qq.com 是同一类处理。
  - DOMAIN,mtalk.google.com,📢 谷歌服务
  - DOMAIN,mtalk-dev.google.com,📢 谷歌服务
  - DOMAIN,mtalk-staging.google.com,📢 谷歌服务
  - DOMAIN,alt1-mtalk.google.com,📢 谷歌服务
  - DOMAIN,alt2-mtalk.google.com,📢 谷歌服务
  - DOMAIN,alt3-mtalk.google.com,📢 谷歌服务
  - DOMAIN,alt4-mtalk.google.com,📢 谷歌服务
  - DOMAIN,alt5-mtalk.google.com,📢 谷歌服务
  - DOMAIN,alt6-mtalk.google.com,📢 谷歌服务
  - DOMAIN,alt7-mtalk.google.com,📢 谷歌服务
  - DOMAIN,alt8-mtalk.google.com,📢 谷歌服务
  - DOMAIN-SUFFIX,statsigapi.net,REJECT-DROP
  # 联网检测、局域网设备、NTP 校时必须直连。
  - DOMAIN-SUFFIX,msftconnecttest.com,🎯 全球直连
  - DOMAIN-SUFFIX,msftncsi.com,🎯 全球直连
  - DOMAIN-SUFFIX,ipv6.microsoft.com,🎯 全球直连
  - DOMAIN-SUFFIX,router.asus.com,🎯 全球直连
  - DOMAIN-SUFFIX,linksys.com,🎯 全球直连
  - DOMAIN-SUFFIX,linksyssmartwifi.com,🎯 全球直连
  - DOMAIN-SUFFIX,belkin.com,🎯 全球直连
  - DOMAIN-SUFFIX,pool.ntp.org,🎯 全球直连
  - DOMAIN-SUFFIX,ntp.org.cn,🎯 全球直连
  - DOMAIN-SUFFIX,time.edu.cn,🎯 全球直连
  # 中国区地图服务器直连，走代理会让地图数据错乱。
  - DOMAIN,gspe11-2-cn-ssl.ls.apple.com,🎯 全球直连
  - DOMAIN,gspe12-cn-ssl.ls.apple.com,🎯 全球直连
  - DOMAIN,gspe19-cn-ssl.ls.apple.com,🎯 全球直连
  - DOMAIN,gspe19-2-cn-ssl.ls.apple.com,🎯 全球直连
  - DOMAIN,gspe79-cn-ssl.ls.apple.com,🎯 全球直连
  - DOMAIN-SUFFIX,is.autonavi.com,🎯 全球直连
  # 游戏本体下载走直连，否则几十 GB 烧机场套餐。
