    type: url-test
    include-all: true
    filter: "(?i)(住宅|家宽|家寬|原生|Residential)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "🛣️ 专线"
    type: url-test
    include-all: true
    filter: "(?i)(专线|專線|IPLC|IEPL)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "🎞️ 流媒体节点"
    type: url-test
    include-all: true
    filter: "(?i)(流媒体|流媒體)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "💴 低倍率"
    type: url-test
    include-all: true
    filter: "(?i)(?<![0-9.])0\\.[0-9]+ ?x"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  # 协议分组。mihomo 没有 include-type，只能反着排除其余全部类型。
  # 这些名字是 AdapterType.String() 的形式——group 层比较的是它，
  # 不是配置里的 type: 值，所以必须写 Shadowsocks 而不是 ss。
  - name: "🔐 VLESS 节点"
    type: url-test
    include-all: true
    exclude-type: "Shadowsocks|ShadowsocksR|Snell|Socks5|Http|Vmess|Trojan|Hysteria|Hysteria2|WireGuard|Tuic|Ssh|Mieru|AnyTLS"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "⚡ HY2 节点"
    type: url-test
    include-all: true
    exclude-type: "Shadowsocks|ShadowsocksR|Snell|Socks5|Http|Vmess|Vless|Trojan|Hysteria|WireGuard|Tuic|Ssh|Mieru|AnyTLS"
