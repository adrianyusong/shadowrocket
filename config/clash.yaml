  - RULE-SET,github-classical,🐱 GITHUB
  # LinkedIn：最初引入时 Global / ChinaMax / QuantumultX-China 三个规则集都不含
  # linkedin.com 与 licdn.com，导致它一路落到 GEOIP,CN（现在 proxy.list 已收了
  # linkedin.com，这段仍保留作保险，且 .cn 两个根域只有这里有）。国内 DNS 有时把 linkedin.com 解析到
  # 国内 IP，于是被判成国内服务走直连——日志实测 www.linkedin.com 出现 9 次
  # GEOIP,CN -> DIRECT，与代理走向混杂，表现为时好时坏。
  # 领英中国（linkedin.cn / licdn.cn）已于 2023 年停运，一并走代理。
  # 必须排在 DOMAIN-SUFFIX,cn 与 GEOIP,CN 之前。
  #
  # 五个根域取自五份日志的全量汇总。必须用 DOMAIN-SUFFIX 而非 DOMAIN-KEYWORD：
  # "licdn" 是 "alicdn"（阿里 CDN）的子串，用关键词会把阿里 CDN 全部推进代理。
  - DOMAIN-SUFFIX,linkedin.com,🚀 节点选择
  - DOMAIN-SUFFIX,licdn.com,🚀 节点选择
  - DOMAIN-SUFFIX,linkedin-ei.com,🚀 节点选择
  - DOMAIN-SUFFIX,linkedin.cn,🚀 节点选择
  - DOMAIN-SUFFIX,licdn.cn,🚀 节点选择
  # 被墙的微博镜像 / 反审查站点。china.list 的 DOMAIN-KEYWORD,weibo 排在
  # proxy.list 之前，会把它们送去直连——而它们在国内直连打不开。
  - DOMAIN-SUFFIX,freeweibo.com,🚀 节点选择
  - DOMAIN-SUFFIX,freechinaweibo.com,🚀 节点选择
  - DOMAIN-SUFFIX,weiboleak.com,🚀 节点选择
